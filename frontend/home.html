<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Resources</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,400;1,600&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body class="split-view">
  <header class="site-header">
    <div class="site-heading">
      <span class="site-kicker">CSYE 6225 &middot; Class Archive</span>
      <h1>Study Resources</h1>
      <svg class="squiggle" viewBox="0 0 150 10"><path d="M2 6 Q 14 -2, 26 6 T 50 6 T 74 6 T 98 6 T 122 6 T 148 6"/></svg>
    </div>
    <div class="header-actions" style="display: flex; align-items: center; gap: 0.75rem;">
      <a href="add.html" id="add-resource-link" class="btn btn-primary">&#43; Add resource</a>
      <span id="auth-control"></span>
    </div>
  </header>

  <main class="container">
    <p class="subtitle">Study links and files shared by the class &mdash; vote on what actually helped.</p>

    <div class="layout">
      <div class="list-pane" id="list-pane">
        <form class="search-bar" id="search-form">
          <input type="text" id="search-input" placeholder="Search by subject&hellip; a word, or a whole sentence works too">
          <button type="submit" class="btn btn-open">Search</button>
          <button type="button" class="btn btn-secondary-outline" id="search-clear">Clear</button>
        </form>

        <p id="status-message" class="status-message" style="display: none;"></p>

        <section class="card-list" id="card-list"></section>

        <footer class="site-footer">
          <p>Made by the class, for the class</p>
        </footer>
      </div>

      <aside class="detail-pane" id="detail-pane">
        <div id="detail-body">
          <p class="detail-placeholder">Select a resource from the list to see its details here.</p>
        </div>
      </aside>
    </div>
  </main>

  <script src="config.js?v=2"></script>
  <script src="auth.js?v=1"></script>
  <script src="header.js?v=1"></script>
  <script src="home.js?v=2"></script>
</body>
</html>
