<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a Resource — Study Resources</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,400;1,600&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header class="site-header">
    <div class="site-heading">
      <span class="site-kicker">CSYE 6225 &middot; Class Archive</span>
      <h1>Study Resources</h1>
      <svg class="squiggle" viewBox="0 0 150 10"><path d="M2 6 Q 14 -2, 26 6 T 50 6 T 74 6 T 98 6 T 122 6 T 148 6"/></svg>
    </div>
    <a href="home.html" class="btn btn-secondary">&larr; Back to home</a>
  </header>

  <main class="container">
    <h2 class="page-title">Add a resource</h2>
    <p class="subtitle">Share a study link, upload a file, or both.</p>

    <form class="resource-form" id="add-resource-form">

      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="e.g., Intro to REST APIs" required maxlength="100">
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="e.g., Math, Web Development, or anything else" required maxlength="50">
      </div>

      <div class="form-group" id="url-group">
        <label for="url">URL <span class="hint-inline">(optional if uploading a file)</span></label>
        <input type="url" id="url" name="url" placeholder="https://...">
      </div>

      <div class="form-group" id="file-group">
        <label for="file">File <span class="hint-inline">(optional if sharing a URL)</span></label>
        <input type="file" id="file" name="file" accept=".pdf,.doc,.docx,.mp4">
        <small class="hint">Max 25 MB. Allowed: PDF, Word doc, MP4. Provide a URL, a file, or both.</small>
      </div>

      <div class="form-group">
        <label for="note">Notes <span class="hint-inline">(optional — multiple paragraphs are fine)</span></label>
        <textarea id="note" name="note" rows="6" maxlength="2000" placeholder="Why is this helpful? Add as much detail as you want."></textarea>
      </div>

      <p id="form-error" class="form-error" role="alert" style="display: none;"></p>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add Resource</button>
        <a href="home.html" class="btn btn-secondary">Cancel</a>
      </div>

    </form>
  </main>

  <footer class="site-footer">
    <p>Made by the class, for the class</p>
  </footer>

  <script src="config.js?v=2"></script>
  <script src="header.js?v=1"></script>
  <script src="add.js?v=2"></script>
</body>
</html>
