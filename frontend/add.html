<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a Resource — Study Resources</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Study Resources</h1>
    <a href="home.html" class="btn btn-secondary">← Back to Home</a>
  </header>

  <main class="container">
    <h2 class="page-title">Add a Resource</h2>
    <p class="subtitle">Share a study link or upload a file that helped you.</p>

    <form class="resource-form" id="add-resource-form">

      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="e.g., Intro to REST APIs" required maxlength="100">
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <select id="subject" name="subject" required>
          <option value="">-- Choose a subject --</option>
          <option value="Math">Math</option>
          <option value="Web Development">Web Development</option>
          <option value="Databases">Databases</option>
          <option value="Cloud Computing">Cloud Computing</option>
          <option value="Programming">Programming</option>
          <option value="Tools">Tools</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Type</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="type" value="link" checked>
            <span>Web link</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="type" value="file">
            <span>Upload file</span>
          </label>
        </div>
      </div>

      <div class="form-group" id="url-group">
        <label for="url">URL</label>
        <input type="url" id="url" name="url" placeholder="https://...">
      </div>

      <div class="form-group" id="file-group" style="display: none;">
        <label for="file">File</label>
        <input type="file" id="file" name="file" accept=".pdf,.doc,.docx,.mp4">
        <small class="hint">Max 25 MB. Allowed: PDF, Word doc, MP4.</small>
      </div>

      <div class="form-group">
        <label for="note">One-line note (optional)</label>
        <input type="text" id="note" name="note" placeholder="Why is this helpful?" maxlength="200">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add Resource</button>
        <a href="home.html" class="btn btn-secondary">Cancel</a>
      </div>

    </form>
  </main>
</body>
</html>
